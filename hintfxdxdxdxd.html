<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hint F — Nescafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #060606; --panel: #0c0c0c; --red: #ff2b2b; --red-dim: #7a1414; --red-glow: rgba(255,43,43,0.55); --text-dim: #a33;
    --green: #2bff6a; --green-glow: rgba(43,255,106,0.5);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background: repeating-linear-gradient(0deg, rgba(255,0,0,0.02) 0 2px, transparent 2px 4px), radial-gradient(ellipse at 50% -10%, #150404, var(--bg) 60%);
    font-family:'Share Tech Mono', monospace; color:var(--red);
    display:flex; justify-content:center; align-items:center; padding:24px 14px 60px;
  }
  .board{
    width:100%; max-width:520px; background: var(--panel); border:1px solid var(--red-dim); border-radius:2px;
    box-shadow: 0 0 0 1px #000, 0 0 40px rgba(255,0,0,0.08), inset 0 0 60px rgba(255,0,0,0.03);
    padding:28px 22px 32px; position:relative; overflow:hidden;
  }
  .board::before{
    content:""; position:absolute; inset:0;
    background-image: repeating-linear-gradient(0deg, rgba(255,43,43,0.025) 0 1px, transparent 1px 3px);
    pointer-events:none;
  }
  .badge{
    font-family:'Share Tech Mono',monospace; color:var(--red-dim); text-align:center;
    text-transform:uppercase; letter-spacing:2px; font-size:0.8rem; margin-bottom:6px;
  }
  .badge::before{ content:"[ "; }
  .badge::after{ content:" ]"; }
  h1{
    font-family:'VT323', monospace; font-size:2.2rem; text-align:center;
    color:var(--red); margin:0 0 20px; letter-spacing:2px; text-shadow: 0 0 8px var(--red-glow);
  }
  h1::before{ content:"> "; }
  h1::after{ content:"_"; animation: blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  label{ display:block; font-family:'Share Tech Mono',monospace; font-size:0.9rem; color:var(--red); margin-bottom:6px; text-transform:uppercase; letter-spacing:1px; }
  label::before{ content:"$ "; color:var(--red-dim); }
  input[type=text]{
    width:100%; padding:11px 12px; border-radius:2px; border:1px solid var(--red-dim);
    background:#0a0a0a; color:var(--red); font-family:'Share Tech Mono',monospace; font-size:1rem; outline:none;
  }
  input[type=text]:focus{ border-color:var(--red); box-shadow:0 0 8px rgba(255,43,43,0.3); }
  input::placeholder{ color:#5a1a1a; }
  .question-box{
    background:#0a0a0a; border:1px solid var(--red-dim); border-radius:2px; padding:20px; margin-bottom:18px;
  }
  .qlabel{ font-family:'Share Tech Mono',monospace; color:var(--red-dim); font-size:0.75rem; text-transform:uppercase; letter-spacing:2px; margin-bottom:8px; }
  .qlabel::before{ content:"// "; }
  .qtext{ font-family:'VT323', monospace; font-size:1.5rem; line-height:1.45; color:var(--red); text-shadow:0 0 6px rgba(255,43,43,0.35); }
  button{
    font-family:'Share Tech Mono',monospace; font-weight:700; font-size:0.95rem; border:none; border-radius:2px;
    padding:11px 18px; cursor:pointer; width:100%; text-transform:uppercase; letter-spacing:1px;
  }
  .btn-primary{ background:var(--red); color:#0a0000; box-shadow: 0 0 12px var(--red-glow); margin-top:12px;}
  .btn-primary:disabled{ opacity:0.35; cursor:not-allowed; box-shadow:none; }
  .answer-form{ margin-top:16px; }
  .feedback{
    margin-top:16px; padding:16px; border-radius:2px; text-align:center;
    font-family:'VT323',monospace; font-size:1.3rem; letter-spacing:1px; display:none;
  }
  .feedback.show{ display:block; }
  .feedback.correct{
    background:#031a08; border:1px solid var(--green); color:var(--green); text-shadow:0 0 8px var(--green-glow);
  }
  .feedback.wrong{
    background:#1a0000; border:1px solid var(--red); color:var(--red); text-shadow:0 0 8px var(--red-glow);
  }
  :focus-visible{ outline: 2px solid var(--red); outline-offset:2px; }
</style>
</head>
<body>
<div class="board">
  <div class="badge">Hint F</div>
  <h1>Hint F</h1>

  <div id="entry-step">
    <label for="team-name">Team name</label>
    <input type="text" id="team-name" placeholder="Enter your team name" maxlength="24">
    <button class="btn-primary" id="show-question-btn">Show the Clue</button>
  </div>

  <div id="question-step" style="display:none;">
    <div class="question-box">
      <div class="qlabel" id="team-tag"></div>
      <div class="qtext">F1 cars require E10 fuel, but you need a spot perfect for sipping a hot drink slowly in the evening. Bypass the heavy meals and find the globally branded, red-colored kiosk that delivers rapid caffeine extraction.</div>
    </div>

    <div class="answer-form">
      <label for="answer-input">Your answer</label>
      <input type="text" id="answer-input" placeholder="Where did the clue lead you?">
      <button class="btn-primary" id="submit-answer-btn">Submit Answer</button>
    </div>

    <div class="feedback" id="feedback"></div>
  </div>
</div>

<script>
  var ACCEPTED = ["nescafe", "nescaf\u00e9"];

  document.getElementById('show-question-btn').onclick = function(){
    var name = document.getElementById('team-name').value.trim();
    if(!name) return;
    document.getElementById('team-tag').textContent = 'Clue for ' + name;
    document.getElementById('entry-step').style.display = 'none';
    document.getElementById('question-step').style.display = 'block';
  };

  function normalize(str){
    return str.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  }

  document.getElementById('submit-answer-btn').onclick = function(){
    var raw = document.getElementById('answer-input').value;
    var norm = normalize(raw);
    var fb = document.getElementById('feedback');
    var correct = ACCEPTED.some(function(a){ return norm.indexOf(normalize(a)) !== -1; });

    if(!raw.trim()){ return; }

    if(correct){
      fb.className = 'feedback show correct';
      fb.innerHTML = 'ACCESS GRANTED';
    } else {
      fb.className = 'feedback show wrong';
      fb.innerHTML = 'ACCESS DENIED';
    }
  };
</script>
</body>
</html>
